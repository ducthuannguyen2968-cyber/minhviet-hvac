[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@libsql/client"]

# Dung chung mot duong dan /api/submit-lead voi Cloudflare Pages,
# de doi nen tang khong phai sua lai ma nguon.
[[redirects]]
  from = "/api/submit-lead"
  to = "/.netlify/functions/submit-lead"
  status = 200
  force = true

# Admin panel /admin - CRUD san pham/khach hang/don hang, xac thuc bang header x-admin-password.
[[redirects]]
  from = "/admin/api/*"
  to = "/.netlify/functions/admin-api"
  status = 200
  force = true

# Webhook nhan thanh toan tu SePay (xac thuc bang Authorization: Apikey ...).
[[redirects]]
  from = "/api/sepay-webhook"
  to = "/.netlify/functions/sepay-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/api/payment-api"
  to = "/.netlify/functions/payment-api"
  status = 200
  force = true

# Khong phuc vu ma nguon ham Cloudflare duoi dang file tinh.
[[redirects]]
  from = "/functions/*"
  to = "/index.html"
  status = 404
