[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Dung chung mot duong dan /api/submit-lead voi Cloudflare Pages,
# de doi nen tang khong phai sua lai ma nguon.
[[redirects]]
  from = "/api/submit-lead"
  to = "/.netlify/functions/submit-lead"
  status = 200
  force = true

# Khong phuc vu ma nguon ham Cloudflare duoi dang file tinh.
[[redirects]]
  from = "/functions/*"
  to = "/index.html"
  status = 404
